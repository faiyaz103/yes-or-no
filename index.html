<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Little Question 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="card">

            <div class="heart">💗</div>

            <h1>A Little Question</h1>

            <p class="question">
                Would you go on a date with me?
            </p>

            <div class="button-area">

                <button
                    id="yesButton"
                    class="btn yes-button"
                >
                    Yes 💕
                </button>

                <button
                    id="noButton"
                    class="btn no-button"
                >
                    No
                </button>

            </div>

            <div
                id="successMessage"
                class="success-message hidden"
            >
                <div class="success-heart">🥰</div>

                <h2>Yay! 💗</h2>

                <p>
                    I knew you would say yes!
                </p>

                <div class="date-details">
                    <p>
                        <strong>Date & Time:</strong>
                        Everyday, Anytime 💕
                    </p>

                    <p>
                        <strong>Location:</strong>
                        Below the blue sky and above the green grass 🌤️🌿
                    </p>
                </div>
            </div>


        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
